<div class="grid" id="g"></div>
<script>
/** Small DOM and text helpers. No framework: the whole app is a handful of
 *  screens, and a build step is one more thing to break between us and a student. */

/** Build an element. h('div.card', {onclick}, child, 'text') */
function h(spec, props, ...children) {
  const [tag, ...classes] = String(spec).split('.');
  const el = document.createElement(tag || 'div');
  if (classes.length) el.className = classes.join(' ');
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = (el.className + ' ' + v).trim();
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

const $ = (sel, root = document) => root.querySelector(sel);

function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }

/** Content is authored in a Google Doc, so it can carry the odd escaped markdown
 *  character and a stray HTML entity from the old game copy. Tidy both, and never
 *  put author text into innerHTML. */
function tidy(text) {
  if (!text) return '';
  return String(text)
    .replace(/\\([<>&*_[\]])/g, '$1')
    .replace(/&mdash;/g, ',')
    .replace(/<\/?b>/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

const CLOSERS = `"'’”)]`;
const ENDERS = '.!?';

/** Split prose into sentences without ever losing a character.
 *
 *  Written as a scan rather than a regex on purpose. A regex that asks for
 *  whitespace after the full stop quietly skips text when a sentence ends inside
 *  a quote, and Rule 14's "red to red, safely ahead." is exactly that shape, so
 *  the mnemonic disappeared off the page. Slicing between cut points cannot drop
 *  anything, whatever the punctuation does. */
function sentences(text) {
  const s = tidy(text);
  if (!s) return [];
  const out = [];
  let start = 0;
  for (let i = 0; i < s.length; i++) {
    if (!ENDERS.includes(s[i])) continue;
    let end = i;
    while (end + 1 < s.length && ENDERS.includes(s[end + 1])) end++;      // ellipsis, "!?"
    while (end + 1 < s.length && CLOSERS.includes(s[end + 1])) end++;     // the closing quote
    if (end + 1 >= s.length || /\s/.test(s[end + 1])) {
      out.push(s.slice(start, end + 1).trim());
      start = end + 1;
      i = end;
    }
  }
  const tail = s.slice(start).trim();
  if (tail) out.push(tail);
  return out.filter(Boolean);
}

/** Group prose into paragraphs the eye can cope with on a phone. */
function paragraphs(text, everyNSentences = 3) {
  const list = sentences(text);
  const out = [];
  for (let i = 0; i < list.length; i += everyNSentences) {
    out.push(list.slice(i, i + everyNSentences).join(' ').trim());
  }
  return out.filter(Boolean);
}

function toast(message, ms = 2600) {
  const host = $('#toasts');
  if (!host) return;
  const el = h('div.toast', {}, message);
  host.append(el);
  setTimeout(() => el.remove(), ms);
}

const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

/** Fisher-Yates on a copy, with the index map back to the original order so a
 *  shuffled question can still report which option the student actually picked. */
function shuffleWithMap(list) {
  const idx = list.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  return { items: idx.map((i) => list[i]), map: idx };
}

function plural(n, one, many) { return n === 1 ? one : (many || one + 's'); }

/** The vessel viewer: a boat a student can drag round to see it from any angle.
 *
 *  Why we draw this ourselves rather than loading a 3D library and a bought model.
 *  The teaching point is not what a trawler looks like, it is what we can see of
 *  one from where we are sitting. A sidelight is only visible through its own arc,
 *  so as we drag round the starboard side the green light dies at 22.5 degrees
 *  abaft the beam and the sternlight picks up. A stock model cannot do that,
 *  because the arcs are the lesson. Doing the geometry ourselves also keeps the
 *  student bundle dependency-free and small, which matters on a marina wifi.
 *
 *  Coordinates: x to starboard, y up, z forward, with the bow at +z. All angles in
 *  degrees on the way in, radians inside.
 */

const DEG = Math.PI / 180;

// ---------------------------------------------------------------- light arcs

/**
 * Rule 21 in numbers. A bearing here is measured from the vessel's own bow:
 * 0 is dead ahead, positive to starboard, negative to port, so the beam is 90.
 *
 * "22.5 degrees abaft the beam" is 112.5 from the bow, which is where the
 * masthead light and the sidelights stop and the sternlight starts. That single
 * number is most of what the light rules are made of.
 */
const ARCS = {
  masthead: { from: -112.5, to: 112.5 },     // 225 degrees, ahead to abaft both beams
  starboard: { from: 0, to: 112.5 },         // 112.5 degrees, ahead to abaft the starboard beam
  port: { from: -112.5, to: 0 },             // 112.5 degrees, ahead to abaft the port beam
  stern: { from: 112.5, to: -112.5 },        // 135 degrees, the wedge behind, so it wraps
  allround: null,                            // 360, visible wherever we stand
};

/** Normalise any bearing to the -180..180 range the arcs are written in. */
function normalise(bearing) {
  let b = ((bearing + 180) % 360 + 360) % 360 - 180;
  if (b === -180) b = 180;
  return b;
}

/**
 * Can an observer on this bearing see a light with this arc?
 *
 * The sternlight is the awkward one: its wedge runs from 112.5 through 180 and
 * back to -112.5, so it crosses the join in the numbers and the test has to be
 * "outside the middle" rather than "between the two".
 */
function visibleFrom(arcName, bearing) {
  const arc = ARCS[arcName];
  if (!arc) return true;                     // all-round, or a light we have no arc for
  const b = normalise(bearing);
  if (arc.from <= arc.to) return b >= arc.from && b <= arc.to;
  return b >= arc.from || b <= arc.to;       // the wedge that wraps past 180
}

// ------------------------------------------------------------ the catalogue

const WHITE = '#fff6de';
const RED = '#ff4d4d';
const GREEN = '#3ddc84';
const YELLOW = '#ffd84d';

/** Where a light sits on the boat, in hull units. Set by the preset below. */
function light(arc, colour, pos, label, opts = {}) {
  return { arc, colour, pos, label, ...opts };
}

/**
 * Vessels keyed to the rules that describe them. Each preset is the answer to

      light('stern', YELLOW, [0, 1.7, -4.8], 'Towing light, yellow, above the sternlight'),

// ------------------------------------------------------------- the geometry
//
// Rebuilt 19 Sep 2026. The first hull was a lofted wedge with a post on it,
// which was enough to get the light arcs right and nothing like enough for a
// student to look at and think "sailing yacht". Recognising the vessel from its
// shape and its lights IS the exercise, so the shape has to carry its share.
//
// Still hand-built from boxes and lofted stations rather than a modelled asset,
// on purpose: no download, no WebGL, nothing to load on a phone with one bar of
// signal, and every vertex is a number somebody can read and adjust.

/** Cross-sections down the boat: [z, beam]. The bow station has no beam, which
 *  is what makes it a point rather than a blunt end, and the station just abaft
 *  it is what gives a fine entry rather than a barge. */
const STATIONS = {
  power:   [[5.4, 0.0], [5.0, 0.9], [4.3, 1.8], [3.4, 2.5], [2, 3.0], [0, 3.2], [-2.6, 3.0], [-5, 2.6]],
  sail:    [[5.6, 0.0], [5.1, 0.6], [4.3, 1.3], [3.2, 2.0], [1.6, 2.5], [0, 2.6], [-2.6, 2.3], [-4.6, 1.5], [-5.0, 0.9]],
  fishing: [[5.4, 0.0], [5.0, 1.0], [4.3, 2.0], [3.4, 2.7], [2, 3.1], [0, 3.3], [-2.6, 3.1], [-5, 2.9]],
  tug:     [[5.4, 0.0], [5.0, 1.1], [4.3, 2.1], [3.4, 2.8], [2, 3.2], [0, 3.3], [-2.6, 3.2], [-5, 3.0]],
};

const DECK_Y = 0.65;
// The hull stops just under the waterline. Nobody sees a boat's underwater
// body from another boat, and the water is painted first, so anything drawn
// below y=0 shows THROUGH the sea and the boat looks to be sitting on top of
// it. The first cut went to -0.75 and floated a foot too high for that reason.
const KEEL_Y = -0.16;

/** Sheer: the deck line rises towards the bow, and a touch at the stern. A flat
 *  deck edge is the single thing that most makes a hull read as a box. */
function deckY(z, kind) {
  const bow = Math.max(0, z / 5);
  const stern = Math.max(0, -z / 5);
  const rise = kind === 'sail' ? 0.42 : 0.55;
  return DECK_Y + rise * Math.pow(bow, 1.6) + 0.10 * Math.pow(stern, 2);
}

/** Six points round a section, deck edge to keel and back, so the topsides have
 *  a turn of bilge rather than one flat slab per side. */
function ring(z, beam, kind) {
  const w = beam / 2;
  const dy = deckY(z, kind);
  const mid = dy - 0.42;
  const k = w * 0.32;
  return [
    [-w, dy, z], [-w * 0.94, mid, z], [-k, KEEL_Y, z],
    [k, KEEL_Y, z], [w * 0.94, mid, z], [w, dy, z],
  ];
}

function box(cx, cy, cz, w, hgt, len) {
  const x0 = cx - w / 2, x1 = cx + w / 2;
  const y0 = cy, y1 = cy + hgt;
  const z0 = cz - len / 2, z1 = cz + len / 2;
  const v = [
    [x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0],
    [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1],
  ];
  const f = [
    [0, 1, 2, 3], [5, 4, 7, 6], [4, 0, 3, 7],
    [1, 5, 6, 2], [3, 2, 6, 7], [4, 5, 1, 0],
  ];
  return { v, f };
}

/** A sail: a triangle with a little belly, drawn as two panels so the curve
 *  catches the light differently on each side. Sheeted slightly to port, which
 *  is what stops it vanishing into a line when we look from dead ahead. */
function sail(tack, head, clew, belly) {
  const mid = [
    (tack[0] + clew[0]) / 2 + belly, (tack[1] + head[1]) / 2 + 0.2, (tack[2] + clew[2]) / 2,
  ];
  // Seams: lines from luff to leech at even heights, the way a sail is
  // actually stitched. Kept in 3D so they foreshorten with the cloth.
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  const seams = [];
  for (const t of [0.2, 0.4, 0.6, 0.8]) seams.push([lerp(tack, head, t), lerp(clew, head, t)]);
  return { v: [tack, head, clew, mid], f: [[0, 1, 3], [3, 1, 2], [0, 3, 2]], lines: seams };
}

/** A painted band along the hull at the waterline: the boot-top every real
 *  boat has, and the single cheapest thing that makes a grey hull look
 *  finished rather than primed. Built as a thin strip of quads following the
 *  stations, just above the water on each side. */
function bootTop(stations, kind) {
  const v = [], f = [];
  const y0 = -0.03, y1 = 0.17;
  for (const [z, beam] of stations) {
    const w = (beam / 2) * 0.96;
    v.push([-w, y0, z], [-w, y1, z], [w, y1, z], [w, y0, z]);
  }
  for (let i = 0; i < stations.length - 1; i++) {
    const a = i * 4, b = a + 4;
    f.push([a, a + 1, b + 1, b], [a + 3, a + 2, b + 2, b + 3]);
  }
  return { v, f };
}

/** Build the hull, plus whatever sits on the deck for this kind of boat. Each
 *  face carries a tone (how much light it catches) and optionally a colour and
 *  an alpha, which is how sails get to be pale and a little see-through. */
function buildHull(kind) {
  const stations = STATIONS[kind] || STATIONS.power;
  const verts = [];
  const faces = [];

  const rings = stations.map(([z, beam]) => {
    const start = verts.length;
    for (const p of ring(z, beam, kind)) verts.push(p);
    return start;
  });

  for (let i = 0; i < rings.length - 1; i++) {
    const a = rings[i], b = rings[i + 1];
    // Five side panels round the section, lighter up top, darker at the bilge.
    const tones = [0.86, 0.66, 0.52, 0.66, 0.86];
    for (let j = 0; j < 5; j++) faces.push({ idx: [a + j, a + j + 1, b + j + 1, b + j], tone: tones[j] });
    faces.push({ idx: [a, b, b + 5, a + 5], tone: 1.0, colour: 'deck' });   // the deck
  }
  const last = rings[rings.length - 1];
  faces.push({ idx: [last + 5, last + 4, last + 3, last + 2, last + 1, last], tone: 0.6 });  // transom

  const lines = [];
  function add(part, tone, extra = {}) {
    const base = verts.length;
    for (const p of part.v) verts.push(p);
    for (const f of part.f) faces.push({ idx: f.map((i) => base + i), tone, ...extra });
    for (const l of part.lines || []) lines.push({ a: l[0], b: l[1], colour: extra.lineColour || 'rgba(0,0,0,0.22)' });
  }
  /** Vertical dividers down a window band, so it reads as panes not a stripe. */
  function panes(cx, cy, cz, w, hgt, len, n) {
    const out = [];
    for (let i = 1; i < n; i++) {
      const z = cz - len / 2 + (len / n) * i;
      for (const x of [cx - w / 2 - 0.01, cx + w / 2 + 0.01]) out.push([[x, cy, z], [x, cy + hgt, z]]);
    }
    return { v: [], f: [], lines: out };
  }

  add(bootTop(stations, kind), 0.7, { colour: 'stripe' });

  if (kind === 'power') {
    add(box(0, DECK_Y + 0.05, 0.4, 2.3, 1.45, 3.4), 0.92);                       // wheelhouse
    add(box(0, DECK_Y + 0.85, 0.4, 2.34, 0.42, 3.44), 0.22, { colour: 'glass' });  // the window band
    add(panes(0, DECK_Y + 0.85, 0.4, 2.34, 0.42, 3.44, 4), 0, { lineColour: 'rgba(10,18,40,0.6)' });
    add(box(0, DECK_Y + 1.5, 1.2, 0.14, 1.15, 0.14), 0.7);                       // masthead post
    add(box(-0.95, DECK_Y + 1.5, -1.0, 0.12, 0.9, 0.12), 0.7);                   // radar arch
    add(box(0.95, DECK_Y + 1.5, -1.0, 0.12, 0.9, 0.12), 0.7);
    add(box(0, DECK_Y + 2.4, -1.0, 2.02, 0.12, 0.12), 0.7);
    add(box(0, DECK_Y + 0.05, -3.2, 2.4, 0.5, 2.6), 0.88);                       // aft deck coaming
  } else if (kind === 'sail') {
    add(box(0, DECK_Y + 0.05, -0.4, 1.7, 0.5, 3.2), 0.92);                       // coachroof
    add(box(0, DECK_Y + 0.05, -3.2, 1.9, 0.28, 1.6), 0.8);                       // cockpit coaming
    add(box(0, DECK_Y, 1.0, 0.16, 6.6, 0.16), 0.7);                              // mast
    add(box(-0.28, DECK_Y + 1.15, -0.8, 0.12, 0.12, 3.6), 0.7);                  // boom, sheeted a touch to port
    // No keel and no rudder. Both were drawn and both had to go: the water is
    // painted first, so anything below the waterline showed straight through it
    // and the yacht looked to be sitting ON the sea rather than in it. Nobody
    // sees a keel from another boat anyway; the sails are what say "yacht".
    add(sail([0, DECK_Y + 1.2, 0.95], [0, DECK_Y + 6.4, 1.0], [-0.6, DECK_Y + 1.25, -2.55], -0.45),
        0.96, { colour: 'sail', alpha: 0.88, lineColour: 'rgba(70,80,110,0.28)' });   // mainsail
    add(sail([0, DECK_Y + 0.35, 5.3], [0, DECK_Y + 5.7, 1.05], [-1.0, DECK_Y + 1.0, -0.3], -0.5),
        0.9, { colour: 'sail', alpha: 0.85, lineColour: 'rgba(70,80,110,0.28)' });    // headsail
  } else if (kind === 'fishing') {
    add(box(0, DECK_Y + 0.05, -2.2, 2.3, 1.5, 2.6), 0.92);                       // wheelhouse aft
    add(box(0, DECK_Y + 0.85, -2.2, 2.34, 0.4, 2.64), 0.22, { colour: 'glass' });
    add(panes(0, DECK_Y + 0.85, -2.2, 2.34, 0.4, 2.64, 3), 0, { lineColour: 'rgba(10,18,40,0.6)' });
    add(box(0, DECK_Y, 0.8, 0.18, 2.9, 0.18), 0.7);                              // gantry post
    add(box(0, DECK_Y + 0.9, 3.0, 0.16, 1.2, 0.16), 0.7);
    add(box(0, DECK_Y + 2.6, 0.8, 2.2, 0.12, 0.12), 0.7);                        // gantry cross-bar
  } else if (kind === 'tug') {
    add(box(0, DECK_Y + 0.05, 1.0, 2.4, 1.7, 3.0), 0.92);                        // deckhouse forward
    add(box(0, DECK_Y + 1.0, 1.0, 2.44, 0.42, 3.04), 0.22, { colour: 'glass' });
    add(box(0, DECK_Y + 1.75, 1.4, 0.2, 2.3, 0.2), 0.7);                         // mast
    add(box(0, DECK_Y + 0.05, -3.0, 1.2, 0.5, 1.4), 0.8);                        // towing winch
  }

  return { verts, faces, lines };
}

// ------------------------------------------------------------- the renderer

/**
 * World point to camera space, for an observer standing on bearing `az` and
 * `el` above the water.
 *
 * The minus sign on x1 is the whole ball game, so it gets a paragraph. Starboard
 * to the right, up, and the bow forward is a left-handed set, which is the
 * natural way to describe a boat but the opposite of what the usual camera
 * formulae assume. Without the flip the picture comes out mirrored: the bow
 * swings the wrong way as we drag round, and the red light ends up on the
 * starboard side, which teaches the exact opposite of the rule.
 */
function rotate(p, az, el) {
  const [x, y, z] = p;
  const ca = Math.cos(-az), sa = Math.sin(-az);
  const x1 = -(x * ca + z * sa);
  const z1 = -x * sa + z * ca;
  const ce = Math.cos(el), se = Math.sin(el);
  const y1 = y * ce - z1 * se;
  const z2 = y * se + z1 * ce;
  return [x1, y1, z2];
}

/** The same projection the renderer uses, exposed so a test can check which side
 *  of the screen the bow lands on rather than trusting the sign above. */
function projector({ az, el, dist }, w, h) {
  const f = Math.min(w, h) * 0.9;
  const cx = w / 2, cy = h / 2 + h * 0.06;
  return (p) => {
    const [x, y, z] = rotate(p, az, el);
    const depth = dist - z;
    if (depth < 0.6) return null;
    const s = f / depth;
    return { x: cx + x * s, y: cy - y * s, depth, s };
  };
}

/**
 * One frame. Everything, hull panels and lights and day shapes alike, goes into
 * a single list sorted back to front, so a light on the far side of the wheelhouse
 * is hidden by it rather than shining through.
 */
function draw(ctx, state, w, h) {
  const { hull, lights, shapes, night, az, focus } = state;

  ctx.clearRect(0, 0, w, h);

  const project = projector(state, w, h);

  // The observer's bearing from the boat is the camera azimuth, which is exactly
  // what the arc test wants. Drag round to starboard and the green light lives
  // until 112.5 and then goes out, which is the whole lesson in one gesture.
  const bearing = normalise(az / DEG);

  drawWater(ctx, project, state, w, h);
  if (night) drawSectors(ctx, project, lights, bearing);

  const items = [];

  for (const face of hull.faces) {
    const pts = face.idx.map((i) => project(hull.verts[i]));
    if (pts.some((p) => !p)) continue;
    // No back-face culling here on purpose. Sorting back to front and painting
    // over is enough for a shape this simple, and culling by winding leaves
    // holes the moment a panel is built the other way round.
    const depth = pts.reduce((a, p) => a + p.depth, 0) / pts.length;
    const lit = lighting(hull.verts, face.idx, night);
    items.push({ depth, kind: 'face', pts, tone: face.tone * lit, colour: face.colour, alpha: face.alpha });
  }

  for (const l of hull.lines || []) {
    const a = project(l.a), b = project(l.b);
    if (!a || !b) continue;
    items.push({ depth: Math.min(a.depth, b.depth) - 0.02, kind: 'line', a, b, colour: l.colour });
  }

  if (night) {
    for (const l of lights) {
      const p = project(l.pos);
      if (!p) continue;
      const lit = visibleFrom(l.arc, bearing);
      items.push({ depth: p.depth - 0.01, kind: 'light', p, light: l, lit });
    }
  } else {
    for (const s of shapes) {
      const p = project(s.pos);
      if (!p) continue;
      items.push({ depth: p.depth - 0.01, kind: 'shape', p, shape: s });
    }
  }

  items.sort((a, b) => b.depth - a.depth);

  for (const it of items) {
    if (it.kind === 'face') {
      ctx.beginPath();
      ctx.moveTo(it.pts[0].x, it.pts[0].y);
      for (const p of it.pts.slice(1)) ctx.lineTo(p.x, p.y);
      ctx.closePath();
      ctx.fillStyle = faceColour(it, night);
      ctx.globalAlpha = it.alpha ?? 1;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = night ? 'rgba(255,255,255,0.06)' : 'rgba(255,255,255,0.12)';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else if (it.kind === 'line') {
      ctx.strokeStyle = it.colour;
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(it.a.x, it.a.y); ctx.lineTo(it.b.x, it.b.y); ctx.stroke();
    } else if (it.kind === 'light') {
      const r = Math.max(3, it.p.s * 0.13);
      if (it.lit) {
        const g = ctx.createRadialGradient(it.p.x, it.p.y, 0, it.p.x, it.p.y, r * 4.5);
        g.addColorStop(0, it.light.colour);
        g.addColorStop(0.25, it.light.colour);
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = 0.75;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(it.p.x, it.p.y, r * 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(it.p.x, it.p.y, r * 0.55, 0, Math.PI * 2);
        ctx.fill();
        // Its reflection, a smear on the water below. Cheap, and it is most of
        // what makes a night scene read as water rather than a black page.
        const wp = project([it.light.pos[0], 0, it.light.pos[2]]);
        if (wp) {
          const g2 = ctx.createRadialGradient(wp.x, wp.y + r * 2, 0, wp.x, wp.y + r * 2, r * 5);
          g2.addColorStop(0, it.light.colour);
          g2.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.globalAlpha = 0.28;
          ctx.fillStyle = g2;
          ctx.beginPath();
          ctx.ellipse(wp.x, wp.y + r * 2, r * 5, r * 1.6, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      } else {
        // An unlit lamp still gets drawn, faintly. Seeing it sitting there dark
        // is what makes "out of its arc" mean something.
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.beginPath();
        ctx.arc(it.p.x, it.p.y, r * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
    } else if (it.kind === 'shape') {
      drawShape(ctx, it.p, it.shape.kind, Math.max(5, it.p.s * 0.3));
    }
  }

  if (focus) {
    ctx.fillStyle = 'rgba(238,242,255,0.92)';
    ctx.font = '500 13px Lexend, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(focus, w / 2, h - 12);
  }
}

/** Hull paint. Tone is how much light the panel catches; at night everything
 *  drops to a dim blue-grey so the lights are the brightest thing on screen,
 *  which is how it actually is. */
/** One light, high and a little to starboard and ahead, like an afternoon sun
 *  or a moon. A face's normal against it gives the lit side and the shaded
 *  side, which is what turns six flat panels into one curved hull.
 *
 *  The panels are not consistently wound, so the normal is pointed outwards by
 *  hand: away from the boat's own centreline. That is right for a hull and
 *  for every box on the deck, and it is why we can shade without culling. */
const LIGHT = (() => { const v = [0.45, 0.80, 0.35]; const n = Math.hypot(...v); return v.map((x) => x / n); })();
function lighting(verts, idx, night) {
  const [a, b, c] = [verts[idx[0]], verts[idx[1]], verts[idx[2]]];
  const u = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
  const v = [c[0] - a[0], c[1] - a[1], c[2] - a[2]];
  let n = [u[1] * v[2] - u[2] * v[1], u[2] * v[0] - u[0] * v[2], u[0] * v[1] - u[1] * v[0]];
  const len = Math.hypot(...n) || 1;
  n = n.map((x) => x / len);
  const cx = idx.reduce((s, i) => s + verts[i][0], 0) / idx.length;
  const cy = idx.reduce((s, i) => s + verts[i][1], 0) / idx.length;
  const cz = idx.reduce((s, i) => s + verts[i][2], 0) / idx.length;
  if (n[0] * cx + n[1] * (cy - 0.3) + n[2] * (cz * 0.05) < 0) n = n.map((x) => -x);
  const d = Math.max(0, n[0] * LIGHT[0] + n[1] * LIGHT[1] + n[2] * LIGHT[2]);
  return night ? 0.72 + 0.28 * d : 0.50 + 0.55 * d;
}

function faceColour(it, night) {
  const t = it.tone;
  if (it.colour === 'stripe') {
    // A dark red boot-top by day; at night it is just a darker band.
    const v = Math.round(night ? 40 + 30 * t : 110 + 70 * t);
    return night ? `rgb(${Math.round(v * 0.9)}, ${Math.round(v * 0.55)}, ${Math.round(v * 0.6)})`
                 : `rgb(${v}, ${Math.round(v * 0.32)}, ${Math.round(v * 0.36)})`;
  }
  if (it.colour === 'sail') {
    const v = Math.round(night ? 120 + 60 * t : 205 + 45 * t);
    return `rgb(${v}, ${v}, ${Math.min(255, v + 8)})`;
  }
  if (it.colour === 'glass') {
    return night ? 'rgba(255, 230, 160, 0.55)' : 'rgb(28, 42, 70)';
  }
  const shade = Math.round(46 + 64 * t) * (night ? 0.52 : 1);
  const deck = it.colour === 'deck';
  return `rgb(${Math.round(shade * (deck ? 0.78 : 0.62))}, ${Math.round(shade * (deck ? 0.82 : 0.78))}, ${Math.round(shade)})`;
}

/** The water, as a disc round the boat drawn to the horizon. Rendering it as
 *  a polygon means it foreshortens with the camera like everything else, so
 *  the horizon lands where it should as we tilt. */
function drawWater(ctx, project, state, w, h) {
  const pts = [];
  for (let a = 0; a < 360; a += 6) {
    const p = project([Math.sin(a * DEG) * 60, 0, Math.cos(a * DEG) * 60]);
    if (p) pts.push(p);
  }
  if (pts.length < 3) return;
  const top = Math.min(...pts.map((p) => p.y));
  const g = ctx.createLinearGradient(0, top, 0, h);
  if (state.night) {
    g.addColorStop(0, 'rgba(14, 30, 62, 0.85)');
    g.addColorStop(1, 'rgba(6, 14, 30, 0.95)');
  } else {
    g.addColorStop(0, 'rgba(72, 130, 190, 0.75)');
    g.addColorStop(1, 'rgba(24, 60, 110, 0.9)');
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (const p of pts.slice(1)) ctx.lineTo(p.x, p.y);
  ctx.closePath();
  ctx.fill();
  // the horizon
  ctx.strokeStyle = state.night ? 'rgba(160, 190, 240, 0.18)' : 'rgba(255,255,255,0.35)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(w, top); ctx.stroke();

  // A little surface on the water: short broken lines across it at a few
  // distances, foreshortened like everything else so the far ones bunch up
  // towards the horizon. Fixed, not animated; a still sea reads as calm and
  // does not eat a phone's battery.
  ctx.strokeStyle = state.night ? 'rgba(170, 200, 255, 0.10)' : 'rgba(255,255,255,0.22)';
  ctx.lineWidth = 1;
  let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let z = -14; z <= 26; z += 2.5) {
    for (let x = -24; x < 24; x += 3) {
      const len = 0.6 + rnd() * 1.6, off = rnd() * 2;
      const a = project([x + off, 0, z + rnd() * 1.2]), b = project([x + off + len, 0, z + rnd() * 1.2]);
      if (!a || !b) continue;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
  }
}

/** Each light's arc laid on the water round the boat, faint, and a touch
 *  brighter for the one we are standing in. This is the diagram from the book
 *  drawn under the actual boat, and dragging round it is how the 112.5 and 135
 *  stop being numbers and start being a shape. */
function drawSectors(ctx, project, lights, bearing) {
  const R = 8.5;
  for (const l of lights) {
    const arc = ARCS[l.arc];
    if (!arc) continue;                          // all-round lights have no edge to show
    const from = arc.from, to = arc.to < arc.from ? arc.to + 360 : arc.to;
    const cx = l.pos[0], cz = l.pos[2];
    const centre = project([cx, 0, cz]);
    if (!centre) continue;
    const pts = [centre];
    for (let b = from; b <= to + 0.01; b += 4.5) {
      const p = project([cx + Math.sin(b * DEG) * R, 0, cz + Math.cos(b * DEG) * R]);
      if (p) pts.push(p);
    }
    if (pts.length < 3) continue;
    ctx.globalAlpha = visibleFrom(l.arc, bearing) ? 0.17 : 0.08;
    ctx.fillStyle = l.colour;
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (const p of pts.slice(1)) ctx.lineTo(p.x, p.y);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

/** Day shapes as flat silhouettes facing us. They are black by rule and they read
 *  better as a clean outline than as a lumpy solid at this size. */
function drawShape(ctx, p, kind, r) {
  ctx.fillStyle = '#0a1123';
  ctx.strokeStyle = 'rgba(238,242,255,0.55)';
  ctx.lineWidth = 1.4;
  const tri = (cx, cy, size, up) => {
    ctx.beginPath();
    if (up) { ctx.moveTo(cx, cy - size); ctx.lineTo(cx + size * 0.85, cy + size); ctx.lineTo(cx - size * 0.85, cy + size); }
    else { ctx.moveTo(cx, cy + size); ctx.lineTo(cx + size * 0.85, cy - size); ctx.lineTo(cx - size * 0.85, cy - size); }
    ctx.closePath(); ctx.fill(); ctx.stroke();
  };
  if (kind === 'ball') {
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  } else if (kind === 'cone-down') {
    tri(p.x, p.y, r, false);
  } else if (kind === 'cone-up') {
    tri(p.x, p.y, r, true);
  } else if (kind === 'cones-apex') {
    tri(p.x, p.y - r * 0.95, r * 0.9, false);
    tri(p.x, p.y + r * 0.95, r * 0.9, true);
  } else if (kind === 'diamond') {
    ctx.beginPath();
    ctx.moveTo(p.x, p.y - r); ctx.lineTo(p.x + r * 0.8, p.y);
    ctx.lineTo(p.x, p.y + r); ctx.lineTo(p.x - r * 0.8, p.y);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  } else if (kind === 'cylinder') {
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, r * 0.8, r * 1.1, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
}

// ----------------------------------------------------------------- the view

/**
 * Build a viewer for one vessel. Returns the element to drop on the page and a
 * destroy() to call when the screen changes, because an animation frame that
 * outlives its canvas is how a phone gets hot.
 */
function createVesselView(spec = {}, doc = document) {
  const preset = PRESETS[spec.preset] || PRESETS.power_under50;
  const hull = buildHull(spec.hull || preset.hull);
  const lights = spec.lights || preset.lights;
  const shapes = spec.shapes || preset.shapes;

  const state = {
    hull, lights, shapes,
    night: spec.night !== false,
    az: -35 * DEG,
    el: 12 * DEG,
    // Close enough that the lights are the first thing we notice, which is the
    // point, and far enough that the whole boat still fits when it is turned
    // side on. Scrolling changes it; "Back to the start" brings it home.
    dist: 13,
    focus: null,
  };

  const wrap = doc.createElement('div');
  wrap.className = 'vessel';

  const canvas = doc.createElement('canvas');
  canvas.className = 'vessel-canvas';
  canvas.setAttribute('role', 'img');
  canvas.setAttribute('aria-label', preset.name + '. Drag to look at it from a different bearing.');
  canvas.tabIndex = 0;
  wrap.append(canvas);

  const readout = doc.createElement('p');
  readout.className = 'vessel-readout small muted';
  wrap.append(readout);

  const bar = doc.createElement('div');
  bar.className = 'vessel-bar';
  const dayNight = doc.createElement('button');
  dayNight.type = 'button';
  dayNight.className = 'chip';
  const reset = doc.createElement('button');
  reset.type = 'button';
  reset.className = 'chip';
  reset.textContent = 'Back to the start';
  bar.append(dayNight, reset);
  wrap.append(bar);

  let raf = 0;
  let dead = false;

  function sizeCanvas() {
    const dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
    const w = canvas.clientWidth || 320;
    const hgt = Math.round(w * 0.62);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(hgt * dpr);
    canvas.style.height = hgt + 'px';
    return dpr;
  }

  function bearingWords(b) {
    const a = Math.abs(Math.round(b));
    if (a <= 5) return 'from right ahead';
    if (a >= 175) return 'from right astern';
    const side = b > 0 ? 'starboard' : 'port';
    if (a < 80) return `from ${a}° on the ${side} bow`;
    if (a <= 100) return `from the ${side} beam`;
    return `from ${180 - a}° on the ${side} quarter`;
  }

  function paint() {
    raf = 0;
    if (dead) return;
    // Words first, picture second. The readout and the button label are the
    // accessible half of this, and they should not depend on a 2d context: a
    // test runner has none, and a browser with canvas blocked still deserves
    // to be told which lights it would be seeing.
    const b = normalise(state.az / DEG);
    if (state.night) {
      const on = lights.filter((l) => visibleFrom(l.arc, b));
      readout.textContent = `Looking at it ${bearingWords(b)}. ${on.length
        ? 'We can see: ' + on.map((l) => l.label.replace(/,.*$/, '')).join(', ') + '.'
        : 'Nothing showing from here.'}`;
    } else {
      readout.textContent = `Looking at it ${bearingWords(b)}. ${shapes.length
        ? 'Day shapes: ' + shapes.map((s) => s.label).join(', ') + '.'
        : 'No day shapes on this one.'}`;
    }
    dayNight.textContent = state.night ? 'Show it by day' : 'Show the lights';
    dayNight.setAttribute('aria-pressed', String(!state.night));

    const ctx = canvas.getContext('2d');
    if (!ctx) return;
    const dpr = sizeCanvas();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(ctx, state, canvas.width / dpr, canvas.height / dpr);
  }

  function schedule() {
    if (raf || dead) return;
    raf = (typeof requestAnimationFrame === 'function')
      ? requestAnimationFrame(paint)
      : setTimeout(paint, 16);
  }

  // --- dragging ---
  let dragging = false;
  let lastX = 0, lastY = 0;

  function down(e) {
    dragging = true;
    const t = e.touches ? e.touches[0] : e;
    lastX = t.clientX; lastY = t.clientY;
    if (e.cancelable) e.preventDefault();
  }
  function move(e) {
    if (!dragging) return;
    const t = e.touches ? e.touches[0] : e;
    state.az += (t.clientX - lastX) * 0.6 * DEG;
    state.el = Math.max(-8 * DEG, Math.min(70 * DEG, state.el + (t.clientY - lastY) * 0.4 * DEG));
    lastX = t.clientX; lastY = t.clientY;
    if (e.cancelable) e.preventDefault();
    schedule();
  }
  function up() { dragging = false; }

  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', up);
  canvas.addEventListener('wheel', (e) => {
    state.dist = Math.max(9, Math.min(40, state.dist + e.deltaY * 0.02));
    if (e.cancelable) e.preventDefault();
    schedule();
  }, { passive: false });

  // Keyboard, because dragging is not available to everyone and the arcs are the
  // point of the thing rather than an optional extra.
  canvas.addEventListener('keydown', (e) => {
    const step = e.shiftKey ? 22.5 : 5;
    if (e.key === 'ArrowLeft') state.az -= step * DEG;
    else if (e.key === 'ArrowRight') state.az += step * DEG;
    else if (e.key === 'ArrowUp') state.el = Math.min(70 * DEG, state.el + 4 * DEG);
    else if (e.key === 'ArrowDown') state.el = Math.max(-8 * DEG, state.el - 4 * DEG);
    else return;
    e.preventDefault();
    schedule();
  });

  dayNight.addEventListener('click', () => { state.night = !state.night; schedule(); });
  reset.addEventListener('click', () => {
    state.az = -35 * DEG; state.el = 12 * DEG; state.dist = 13; schedule();
  });

  const onResize = () => schedule();
  if (typeof window !== 'undefined') window.addEventListener('resize', onResize);

  schedule();

  return {
    el: wrap,
    name: preset.name,
    note: preset.note,
    /** For the tests, and for anything that wants to drive it without a mouse. */
    setBearing(deg) { state.az = deg * DEG; schedule(); },
    get state() { return state; },
    destroy() {
      dead = true;
      if (raf && typeof cancelAnimationFrame === 'function') cancelAnimationFrame(raf);
      if (typeof window !== 'undefined') window.removeEventListener('resize', onResize);
    },
  };
}

const g = document.getElementById('g');
for (const [preset, night, az] of [['sailing', false, 40], ['power_under50', false, -50], ['sailing', true, -35], ['power_under50', true, 120]]) {
  const v = createVesselView({ preset, night }, document); v.setBearing(az);
  const d = document.createElement('div'); d.innerHTML = '<h2>' + v.name + (night ? ' — night' : ' — day') + '</h2>';
  d.appendChild(v.el); g.appendChild(d);
}
</script>
