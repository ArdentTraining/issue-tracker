name: Deploy backend to Apps Script

# When Code.gs changes on main, push the new source to the live Apps Script
# web app via the key-gated deployBackend action. This runs on GitHub's own
# runner, which can reach script.google.com - so a deploy no longer needs a
# browser tab on the app origin. The front end (index.html) is served by
# GitHub Pages automatically on any push, so it needs no step here.

on:
  push:
    branches: [main]
    paths: ['Code.gs']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Deploy Code.gs via deployBackend
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          EXEC_URL: https://script.google.com/macros/s/AKfycbxROZipuieRjz8BBW7tjR5tvbidB_oLwbDup2PHfD0-KUka4u6oQLlUNrjJT21O783qdg/exec
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "DEPLOY_KEY secret is not set - skipping the backend deploy."
            echo "Add it under Settings > Secrets and variables > Actions to switch this on."
            exit 0
          fi
          jq -n --rawfile src Code.gs --arg key "$DEPLOY_KEY" --arg note "CI deploy ${GITHUB_SHA::7}" \
            '{action:"deployBackend", key:$key, source:$src, note:$note}' > payload.json
          echo "Posting $(wc -c < Code.gs) bytes of Code.gs to the backend..."
          # Apps Script answers a POST with a 302 to script.googleusercontent.com
          # where the JSON result lives. -L follows it; the cookie jar carries the
          # session cookie the 302 sets; and a browser User-Agent is needed because
          # the googleusercontent echo serves a "can't open the file" page to plain
          # curl. The doPost itself runs on the first POST regardless.
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          resp=$(curl -sSL -A "$UA" -c /tmp/gs_cj -b /tmp/gs_cj \
            -w "\n__HTTP:%{http_code}__TYPE:%{content_type}__" \
            -X POST "$EXEC_URL" -H "Content-Type: text/plain;charset=utf-8" --data-binary @payload.json)
          echo "First 300 chars: $(printf '%s' "$resp" | head -c 300)"
          echo "Tail: $(printf '%s' "$resp" | tail -c 160)"
          printf '%s' "$resp" | grep -q '"ok":true' || { echo "Deploy confirmation not readable - see diagnostics above."; exit 1; }
          ver=$(printf '%s' "$resp" | sed -n 's/.*"version":\([0-9]*\).*/\1/p')
          echo "Backend deployed as version $ver"
